name: Documentation validation

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, ABI, API, and Markdown parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out technical documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.12.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.0"

      - name: Validate Markdown and navigation
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check_markdown.py

      - name: Check out the pinned protocol source object
        run: |
          python3 scripts/baseline_policy.py
          protocol_repository="$(python3 -c 'import json; print(json.load(open("reference/implementation-baseline.json"))["protocol_repository"])')"
          protocol_branch="$(python3 -c 'import json; print(json.load(open("reference/implementation-baseline.json"))["protocol_branch"])')"
          protocol_commit="$(python3 -c 'import json; print(json.load(open("reference/implementation-baseline.json"))["protocol_commit"])')"
          protocol_tree="$(python3 -c 'import json; print(json.load(open("reference/implementation-baseline.json"))["protocol_tree"])')"
          protocol_repo="$RUNNER_TEMP/ripe-protocol"
          git init "$protocol_repo"
          git -C "$protocol_repo" remote add origin "$protocol_repository"
          trusted_ref="refs/heads/$protocol_branch"
          remote_ref="refs/remotes/origin/$protocol_branch"
          git -C "$protocol_repo" fetch --no-tags --filter=blob:none origin "+$trusted_ref:$remote_ref"
          git -C "$protocol_repo" merge-base --is-ancestor "$protocol_commit" "$remote_ref"
          commits_behind="$(git -C "$protocol_repo" rev-list --count "$protocol_commit..$remote_ref")"
          if [ "$commits_behind" -gt 0 ]; then
            echo "::warning title=Protocol documentation pin is behind::$protocol_commit is $commits_behind commit(s) behind $protocol_branch"
            {
              echo "### Protocol documentation pin"
              echo
              echo "Warning: \`$protocol_commit\` is $commits_behind commit(s) behind \`$protocol_branch\`. The exact pin remains reproducible, but its documentation currentness should be reviewed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git -C "$protocol_repo" checkout --detach "$protocol_commit"
          actual_commit="$(git -C "$protocol_repo" rev-parse 'HEAD^{commit}')"
          actual_tree="$(git -C "$protocol_repo" rev-parse 'HEAD^{tree}')"
          test "$actual_commit" = "$protocol_commit"
          test "$actual_tree" = "$protocol_tree"
          echo "RIPE_PROTOCOL_REPO=$protocol_repo" >> "$GITHUB_ENV"

      - name: Install Foundry 1.3.5
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.3.5

      - name: Recompile the composed Solidity ABI
        run: forge build --root "$RIPE_PROTOCOL_REPO/solidity" --force --skip test

      - name: Install the pinned Vyper compiler
        run: |
          vyper_requirement="$(sed -n 's/^\(vyper==[^[:space:]]*\).*/\1/p' "$RIPE_PROTOCOL_REPO/requirements.txt")"
          python3 -c 'import re, sys; assert re.fullmatch(r"vyper==[0-9]+\.[0-9]+\.[0-9]+", sys.argv[1])' "$vyper_requirement"
          python3 -m pip install --disable-pip-version-check "$vyper_requirement"

      - name: Recompile and verify tracked production ABIs
        run: |
          cd "$RIPE_PROTOCOL_REPO"
          python3 scripts/export_abis.py --check

      - name: Verify source coverage and generated API references
        run: |
          python3 scripts/sync_api_reference.py \
            --protocol-repo "$RIPE_PROTOCOL_REPO" \
            --compiled-artifact-root "$RIPE_PROTOCOL_REPO" \
            --check
